title: RX2 Solutions
description: >-
  Strategic Staffing, HR Outsourcing, and Executive Search across
  Information Technology, Engineering & Manufacturing, Scientific & Clinical,
  Accounting & Finance, and Professional Services. Delivered nationwide.

# CNAME is the apex domain (rx2solutions.com) and the GitHub Pages TLS cert
# covers the apex only, so canonicals use the apex. (The old config pointed
# canonicals at www, which cannot serve HTTPS.)
url: https://rx2solutions.com
logo: /assets/rx2-logo.png

twitter:
  card: summary_large_image
social:
  name: RX2 Solutions
  links:
    - https://www.linkedin.com/company/rx2-solutions

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-redirect-from

collections:
  authors:
    output: true
  case_studies:
    output: true
    permalink: /case-studies/:name/
  landing_pages:
    output: true
    permalink: /landing/:title/

exclude:
  - lambda
  - _inbox

defaults:
  - scope:
      path: ""
    values:
      image: /assets/icons/og-image.png
  - scope:
      path: ""
      type: "authors"
    values:
      layout: "author"
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
      type: "case_studies"
    values:
      layout: "case-study"
  - scope:
      path: ""
      type: "landing_pages"
    values:
      layout: "landing"
      sticky_cta_label: "Get the Hiring Playbook"
      offer_download_title: "Level Up Your Talent Strategy"
      offer_asset_highlight: "Includes editable frameworks and scorecards ready for your team."
  - scope:
      path: ""
    values:
      layout: "default"

future: false

contact_form_endpoint: https://laochjbsna.execute-api.us-east-1.amazonaws.com/rx2SubmitContactForm
landing_opt_in_endpoint: https://laochjbsna.execute-api.us-east-1.amazonaws.com/landingOptIn
# Set this to the GA4 measurement ID, e.g. G-XXXXXXXXXX, to enable Google Analytics.
google_analytics_measurement_id:
