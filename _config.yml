title: RX2 Solutions
description: >-
  Strategic Staffing, HR Outsourcing, and Executive Search across
  Information Technology, Engineering & Manufacturing, Scientific & Clinical,
  Accounting & Finance, and Professional Services. Delivered nationwide.

# CNAME is the apex domain (rx2solutions.com) and the GitHub Pages TLS cert
# covers the apex only, so canonicals use the apex. (The old config pointed
# canonicals at www, which cannot serve HTTPS.)
url: https://rx2solutions.com
logo: /assets/rx2-logo.png

twitter:
  card: summary_large_image
social:
  name: RX2 Solutions
  links:
    - https://www.linkedin.com/company/rx2-solutions

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-redirect-from

collections:
  authors:
    output: true
  case_studies:
    output: true
    permalink: /case-studies/:name/
  landing_pages:
    output: true
    permalink: /landing/:title/

exclude:
  - lambda
  - worker
  - _inbox
  - infrastructure
  - AGENTS.md
  - 2026-08-client-image-update-summary.md
  - README.md

defaults:
  - scope:
      path: ""
    values:
      image: /assets/icons/og-image.png
  - scope:
      path: ""
      type: "authors"
    values:
      layout: "author"
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
      type: "case_studies"
    values:
      layout: "case-study"
  - scope:
      path: ""
      type: "landing_pages"
    values:
      layout: "landing"
      sticky_cta_label: "Get the Hiring Playbook"
      offer_download_title: "Level Up Your Talent Strategy"
      offer_asset_highlight: "Includes editable frameworks and scorecards ready for your team."
  - scope:
      path: ""
    values:
      layout: "default"

future: false

contact_form_endpoint: https://laochjbsna.execute-api.us-east-1.amazonaws.com/rx2SubmitContactForm
# Cloudflare Worker that writes contact submissions to Notion (see /worker).
# Leave empty until the Worker is deployed; the form stays in demo mode.
contact_form_worker_url: https://rx2-contact-form.rx2solutions.workers.dev
# Newsletter capture endpoint (same Worker, /subscribe route). Writes Pending
# subscribers to the Contact US Database until a sending platform is chosen.
subscribe_endpoint: https://rx2-contact-form.rx2solutions.workers.dev/subscribe
landing_opt_in_endpoint: https://laochjbsna.execute-api.us-east-1.amazonaws.com/landingOptIn
# GA4 measurement ID. Renders the gtag snippet in every page head when set.
google_analytics_measurement_id: G-5DP4BNFG0V
