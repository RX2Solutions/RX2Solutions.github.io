collections:
  authors:
    output: true
  case_studies:
    output: true
    permalink: /case-studies/:name/
  landing_pages:
    output: true
    permalink: /landing/:title/

exclude:
  - lambda
  - _inbox

defaults:
  - scope:
      path: ""
      type: "authors"
    values:
      layout: "author"
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
      type: "case_studies"
    values:
      layout: "case-study"
  - scope:
      path: ""
      type: "landing_pages"
    values:
      layout: "landing"
      sticky_cta_label: "Get the Hiring Playbook"
      offer_download_title: "Level Up Your Talent Strategy"
      offer_asset_highlight: "Includes editable frameworks and scorecards ready for your team."
  - scope:
      path: ""
    values:
      layout: "default"

future: false

url: https://www.rx2solutions.com
logo: /assets/images/RX2+Solutions-01+grey+text+added+2.png
landing_opt_in_endpoint: https://laochjbsna.execute-api.us-east-1.amazonaws.com/landingOptIn
google_analytics_measurement_id:
