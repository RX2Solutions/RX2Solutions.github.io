<script>
  // Mobile menu
  var b = document.getElementById('burger'), m = document.getElementById('menu');
  b.addEventListener('click', function(){
    var open = m.classList.toggle('open');
    b.setAttribute('aria-expanded', open ? 'true' : 'false');
  });
  // Dropdowns work on hover for desktop; tap-toggle for touch inside open mobile menu
  Array.prototype.forEach.call(document.querySelectorAll('.menu > li > button'), function(btn){
    btn.addEventListener('click', function(e){
      if (window.innerWidth <= 860) return; // mobile menu shows all links expanded
      e.preventDefault();
    });
  });
  function demo(){
    alert('Internal build: this control is not wired up yet.');
    return false;
  }
  var SUBSCRIBE_ENDPOINT = '{{ site.subscribe_endpoint | default: "" }}';
  function subscribed(e){
    e.preventDefault();
    var f = e.target;
    var emailInput = f.querySelector('input[type="email"]');
    var hp = f.querySelector('input[name="company_website"]');
    if (!SUBSCRIBE_ENDPOINT) {
      f.innerHTML = '<p class="capdone">Thanks. You&#39;re on the list.</p>';
      return false;
    }
    var btn = f.querySelector('button');
    var label = btn ? btn.textContent : '';
    if (btn) { btn.disabled = true; btn.textContent = 'Sending...'; }
    fetch(SUBSCRIBE_ENDPOINT, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        email: emailInput ? emailInput.value : '',
        page: document.title,
        company_website: hp ? hp.value : ''
      })
    }).then(function(r){
      if (!r.ok) throw new Error('subscribe failed');
      f.innerHTML = '<p class="capdone">Thanks. You&#39;re on the list.</p>';
    }).catch(function(){
      if (btn) { btn.disabled = false; btn.textContent = label; }
      alert('Something went wrong. Please try again in a moment.');
    });
    return false;
  }
</script>
