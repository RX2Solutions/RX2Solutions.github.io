<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>{{ page.title }}</title>
    {% if site.google_analytics_measurement_id %}
    <script async src="https://www.googletagmanager.com/gtag/js?id={{ site.google_analytics_measurement_id }}"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', '{{ site.google_analytics_measurement_id }}');
    </script>
    {% endif %}
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css" integrity="sha384-9aIt2nRpC12Uk9gS9baDl411NQApFmC26EwAOH8WgZl5MYYxFfc+NcPb1dKGj7Sk" crossorigin="anonymous" />
    <link rel="stylesheet" href="{{ site.baseurl }}/assets/css/all.min.css">
    <link rel="stylesheet" href="{{ site.baseurl }}/assets/css/owl.carousel.min.css" />
    <link rel="stylesheet" href="{{ site.baseurl }}/assets/css/cubeportfolio.min.css">
    <link rel="stylesheet" href="{{ site.baseurl }}/assets/css/styles.css" />
    {% seo %}
  </head>
